name: Build APK

on:
  push:
    branches:
      - main
      - brain-overhaul-20261004
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate debug keystore
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Detect release signing
        env:
          KEYSTORE_B64: ${{ secrets.EMREXPLORE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.EMREXPLORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.EMREXPLORE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Configure release signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.EMREXPLORE_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.EMREXPLORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.EMREXPLORE_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 --decode > release.keystore
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        if: env.HAS_RELEASE_SIGNING == 'true'

      - name: Verify APK
        shell: bash
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/*.apk
          file app/build/outputs/apk/debug/*.apk
          if [ "$HAS_RELEASE_SIGNING" = "true" ]; then
            ls -lh app/build/outputs/apk/release/*.apk
            file app/build/outputs/apk/release/*.apk
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emrexplore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emrexplore-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
