name: Build APK

on:
  push:
    branches:
      - agent/brain-rebuild
  pull_request:
    branches:
      - agent/brain-rebuild
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  native:
    name: Build Perl + ExifTool (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Load pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          source native/PINS
          echo "perl_cross_tag=$PERL_CROSS_TAG" >> "$GITHUB_OUTPUT"
          echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out perl-cross
        run: |
          git clone --depth 1 --branch "${{ steps.pins.outputs.perl_cross_tag }}"             https://github.com/arsv/perl-cross.git native/perl-cross

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gpg curl tar make patch xz-utils

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ steps.pins.outputs.ndk_version }}

      - name: Build Perl runtime
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          SOURCE_DATE_EPOCH: '1735689600'
        run: native/build.sh ${{ matrix.abi }}

      - name: Upload ABI runtime
        uses: actions/upload-artifact@v4
        with:
          name: exiftool-jni-${{ matrix.abi }}
          path: |
            native/out/${{ matrix.abi }}/libperl.so
            native/out/${{ matrix.abi }}/jniLibs/lib*.so
            native/out/${{ matrix.abi }}/perl5/**
          if-no-files-found: error
          retention-days: 1

  assets:
    name: Build ExifTool asset bundle
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends curl tar

      - name: Restore arm64 Perl tree
        uses: actions/download-artifact@v4
        with:
          name: exiftool-jni-arm64-v8a
          path: native/out/arm64-v8a

      - name: Build perl5.tar
        env:
          SOURCE_DATE_EPOCH: '1735689600'
        run: native/build.sh assets

      - uses: actions/upload-artifact@v4
        with:
          name: exiftool-assets
          path: native/out/assets/perl5.tar
          if-no-files-found: error
          retention-days: 1

  apk:
    name: Build debug APK
    needs: [native, assets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore native runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: exiftool-jni-*
          path: native-artifacts
          merge-multiple: false

      - name: Install native runtimes into app
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "app/src/main/jniLibs/$abi"
            cp "native-artifacts/exiftool-jni-$abi/libperl.so" "app/src/main/jniLibs/$abi/"
            cp native-artifacts/exiftool-jni-$abi/jniLibs/lib*.so "app/src/main/jniLibs/$abi/"
          done

      - name: Restore ExifTool assets
        uses: actions/download-artifact@v4
        with:
          name: exiftool-assets
          path: app/src/main/assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK contains ExifTool runtime
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/libperl.so'
          unzip -l "$APK" | grep 'assets/perl5.tar'
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: emrexplore-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
